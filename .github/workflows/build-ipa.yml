name: Build iPhone app (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned — Sideloadly signs it with your Apple ID)
        run: |
          xcodebuild \
            -project Unforgotten.xcodeproj \
            -scheme Unforgotten \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Unforgotten.app Payload/
          zip -qry Unforgotten.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Unforgotten-ipa
          path: Unforgotten.ipa
